name: SonarQube

# Analyses main on the self-hosted SonarQube server: the code, the tests and their coverage.
# The work is scripts/sonar.sh, the same script a developer runs locally; it needs the repository
# secrets SONAR_HOST_URL and SONAR_TOKEN (copies of the values sonar.env points to in 1Password).
# Pull requests are not analysed - the server is Community Edition, which analyses one branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One analysis at a time; a newer push supersedes one still running.
concurrency:
  group: sonarqube
  cancel-in-progress: true

jobs:
  analyse:
    # Forks have neither the secrets nor a project on the server.
    if: github.repository == 'tmnrtn/simple-cash-flow'
    # GitHub-hosted, for the Docker daemon the API's integration tests (testcontainers) need.
    runs-on: ubuntu-latest

    steps:
      # Full history, so the server can attribute issues to commits and track new code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web

      - name: Analyse
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/sonar.sh
