sonar.projectKey=tmnrtn_simple-cash-flow
sonar.projectName=Simple Cash Flow

# The API keeps its tests in api/test; the web keeps them beside the code in web/src.
sonar.sources=api/src,web/src
sonar.tests=api/test,web/src
sonar.test.inclusions=web/src/**/*.test.js,web/src/**/*.test.jsx,web/src/test/**
sonar.exclusions=web/src/**/*.test.js,web/src/**/*.test.jsx,web/src/test/**

# Written by `npm run test:coverage` in each package (node --test for the API, Vitest for the web).
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,web/coverage/lcov.info

# Coverage-only exclusions, for code with no unit harness. Still analysed for every other rule.
# The web entry point only mounts the app into the page.
sonar.coverage.exclusions=web/src/main.jsx

sonar.sourceEncoding=UTF-8
